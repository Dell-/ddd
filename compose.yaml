services:
  app:
    build:
      context: .
      target: dev
    image: ddd-app:dev
    user: "${UID:-1000}:${GID:-1000}"
    environment:
      APP_DEBUG: "1"
      # development only: set a long random value in production
      APP_SECRET: "dev-secret-change-me-0123456789abcdef"
      APP_CORS_ORIGINS: "http://localhost:3000"
    ports:
      - "8080:8080"
    volumes:
      # live code editing; vendor/ stays the one built into the image
      - ./app:/app/app
      - ./web:/app/web
      - ./bin:/app/bin
      - ./tests:/app/tests
      - ./codeception.yml:/app/codeception.yml
